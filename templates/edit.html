{% extends 'base.html' %}{% block body %}<div class="card"><h1>{{'Изменить книгу' if book else 'Новая книга'}}</h1><form method="post"><label>Название</label><input name="title" required value="{{book.title if book else ''}}"><label>Автор</label><input name="author" required value="{{book.author if book else ''}}"><label>Категория</label><input name="category" required value="{{book.category if book else ''}}"><label>Год первого издания</label><input name="year" type="number" min="1000" max="2100" required value="{{book.year if book else ''}}"><label>Цена, руб.</label><input name="price" type="number" step="0.01" min="0" required value="{{'%0.2f' % (book.price/100) if book else ''}}"><label>Количество экземпляров</label><input name="quantity" type="number" min="0" required value="{{book.quantity if book else 1}}"><label>Статус</label><select name="status"><option value="available" {{'selected' if not book or book.status=='available'}}>В продаже</option><option value="hidden" {{'selected' if book and book.status=='hidden'}}>Скрыта</option></select><p><button>Сохранить</button></p></form></div>{% endblock %}
